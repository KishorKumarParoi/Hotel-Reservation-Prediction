<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="680"/>
    <line x1="400" y1="0" x2="400" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="800" y1="0" x2="800" y2="680"/>
    <line x1="1000" y1="0" x2="1000" y2="680"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">ENTERPRISE MLOPS</text>
    
    <text x="0" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Hotel Reservation Cancellation Architecture</text>
    <text x="0" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">End-to-End Ingestion, Feature Pipeline, Real-Time Inference, and Zero-Downtime Deployment</text>
  </g>

  <!-- Stage 1: Data Ingestion & Storage -->
  <g transform="translate(60, 170)" filter="url(#card-shadow)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-cyan)"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PHASE 1: INGESTION</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Raw Data Layer</text>

    <!-- Node 1: CSV / Cloud Storage -->
    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Hotel_Reservations.csv</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">36,275 Booking Records</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">AWS S3 / GCS Data Lake</text>
    </g>

    <!-- Node 2: Schema Validation -->
    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Schema Validation</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Pydantic / Great Expectations</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">✓ 19 Validated Fields</text>
    </g>

    <!-- Node 3: Stratified Split -->
    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Data Partitioner</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Stratified 80/20 Split</text>
      <text x="16" y="66" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="11">artifacts/raw/train.csv</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 290 380 L 340 380" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 4"/>

  <!-- Stage 2: Feature Engineering & Preprocessing -->
  <g transform="translate(345, 170)" filter="url(#card-shadow)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-purple)"/>
    <text x="24" y="38" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PHASE 2: FEATURES</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Feature Engineering</text>

    <!-- Node 1: Categorical Encoding -->
    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Categorical Encoders</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Market Segment (0..4)</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Room Type &amp; Meal Plan</text>
    </g>

    <!-- Node 2: Skewness Handling -->
    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Skewness Mitigation</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Log1p &amp; Robust Scaling</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Avg Price &amp; Lead Time</text>
    </g>

    <!-- Node 3: Top Feature Selection -->
    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Feature Store Cache</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">10 Optimized Dimensions</text>
      <text x="16" y="66" fill="#ec4899" font-family="-apple-system, sans-serif" font-size="11">Latency &lt; 2ms In-Memory</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 575 380 L 625 380" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 4"/>

  <!-- Stage 3: Model Training & Registry -->
  <g transform="translate(630, 170)" filter="url(#card-shadow)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-emerald)"/>
    <text x="24" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PHASE 3: MODELING</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Gradient Boosting</text>

    <!-- Node 1: HistGB / LightGBM -->
    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">HistGradientBoosting</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Trees: 150 | LR: 0.08</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Accuracy: 89.11%</text>
    </g>

    <!-- Node 2: MLflow Tracking -->
    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Experiment Tracking</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">MLflow Run Logging</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Params, ROC-AUC, F1</text>
    </g>

    <!-- Node 3: Model Registry -->
    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Model Artifact Store</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">artifacts/models/lgbm_model.pkl</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✓ Versioned &amp; Signed</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 860 380 L 910 380" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 4"/>

  <!-- Stage 4: Production Serving & Observability -->
  <g transform="translate(915, 170)" filter="url(#card-shadow)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-cyan)"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PHASE 4: SERVING</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Inference &amp; Ops</text>

    <!-- Node 1: Flask / WSGI Server -->
    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Flask REST API :8080</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">POST /api/predict</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">P95 Latency &lt; 12ms</text>
    </g>

    <!-- Node 2: Web UI -->
    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Interactive Web UI</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Real-Time Cancellation Form</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Instant Risk Score</text>
    </g>

    <!-- Node 3: One-Click Deploy -->
    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">One-Click Deploy</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">bootstrap.sh | deploy.sh</text>
      <text x="16" y="66" fill="#ec4899" font-family="-apple-system, sans-serif" font-size="11">Docker Compose &amp; K8s</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 620)">
    <text x="0" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Single-Command Cloud Bootstrap: curl -fsSL https://raw.githubusercontent.com/KishorKumarParoi/Hotel-Reservation-Prediction/main/bootstrap.sh | bash</text>
    <text x="1080" y="20" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">✓ $0.00 Teardown Verified (clear.sh)</text>
  </g>
</svg>
